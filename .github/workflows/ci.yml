name: CI (reusable)

# Reusable CI workflow for any Frazzled Productions repo, parameterised across stacks
# (Next/Vitest, Expo, plain Node). Consumers call it with their own commands:
#
#   jobs:
#     ci:
#       uses: Frazzled-Productions/.github/.github/workflows/ci.yml@main
#       with:
#         node-version: '24'
#         lint: npm run lint
#         typecheck: npm run typecheck
#         test: npm test
#         build: npm run build
#
# Any step whose input is left empty is skipped. Private consumer repos must be
# allowed to use this workflow: in this (.github) repo's Settings -> Actions ->
# General -> Access, allow access from repositories in the organisation.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      working-directory:
        type: string
        default: '.'
      install:
        type: string
        default: 'npm ci'
      lint:
        type: string
        default: ''
      typecheck:
        type: string
        default: ''
      test:
        type: string
        default: ''
      build:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    # Commands arrive as inputs from the caller's own workflow file and are passed through env vars,
    # never interpolated into the script text (template injection; zizmor checks this in self-test).
    env:
      INSTALL_CMD: ${{ inputs.install }}
      LINT_CMD: ${{ inputs.lint }}
      TYPECHECK_CMD: ${{ inputs.typecheck }}
      TEST_CMD: ${{ inputs.test }}
      BUILD_CMD: ${{ inputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install
        run: eval "$INSTALL_CMD"
      - name: Lint
        if: ${{ inputs.lint != '' }}
        run: eval "$LINT_CMD"
      - name: Typecheck
        if: ${{ inputs.typecheck != '' }}
        run: eval "$TYPECHECK_CMD"
      - name: Test
        if: ${{ inputs.test != '' }}
        run: eval "$TEST_CMD"
      - name: Build
        if: ${{ inputs.build != '' }}
        run: eval "$BUILD_CMD"
