name: Hosted minutes switch

# Moves private repos' light jobs between the included hosted minutes and the Mac (ops OpenSpec
# hosted-minutes-switch). On GitHub-hosted Ubuntu: this repo is public, so it uses no paid minutes and
# keeps running when private minutes are gone and when the Mac is asleep. Writes nothing until the
# repository variable HOSTED_SWITCH_WRITE is true. Dispatch only until the credential exists (rollout
# step 4 adds the hourly schedule), so a fork's pull request never reaches the credential, and the
# hosted-switch environment, restricted to main, keeps it from a workflow on any other branch.
# Logic and tests: tools/hosted-switch/.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-minutes-switch
  cancel-in-progress: false

jobs:
  switch:
    name: Hosted minutes switch
    if: github.repository == 'Frazzled-Productions/.github'
    runs-on: ubuntu-latest
    environment: hosted-switch
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the minutes and set the route
        id: switch
        env:
          GH_TOKEN: ${{ secrets.HOSTED_SWITCH_TOKEN }}
          HOSTED_SWITCH_WRITE: ${{ vars.HOSTED_SWITCH_WRITE }}
        run: python3 tools/hosted-switch/switch.py run
      # The workflow's own token, so an expired credential can still report itself.
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.switch.outcome }}
          AUTH_FAILED: ${{ steps.switch.outputs.auth-failed }}
        run: python3 tools/hosted-switch/switch.py report "$OUTCOME"
