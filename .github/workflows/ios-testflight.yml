name: iOS TestFlight upload (reusable)

# Reusable "archive and upload to TestFlight" for the quick iOS apps, run on the calling repo's
# self-hosted Mac runner. Copies the Release RevenueCat key in from the build Mac (checking it is
# gitignored), then in ONE step under the host build lock (ops scripts/build-lock.sh; a warning and
# no lock when it is missing) runs the engine tests and the app's own release script (which signs with
# the App Store Connect API key), and always deletes the key file afterwards. A reap of this job's own
# stray xcodebuild / simctl processes runs before and after (tools/ios/ci-sim.sh, fetched from this
# repository at this workflow's commit). Timeouts: reap 3 minutes, the locked step 120 (up to 60 of
# it waiting for the lock), the job `timeout-minutes` (130). ops #345. Consumer (thin caller): it must run
# only after CI has passed on the same main commit, so it triggers on workflow_run of CI. The full
# caller, with the gate job (tested SHA is still the tip of main; docs-only merges skipped), is
# loop-year/.github/workflows/testflight-on-main.yml. Outline:
#
#   on:
#     workflow_run:
#       workflows: [CI]
#       types: [completed]
#       branches: [main]
#     workflow_dispatch:
#   concurrency:
#     group: testflight-upload
#     cancel-in-progress: false
#   jobs:
#     gate: ...            # success + push + main, github.sha == workflow_run.head_sha, not docs-only
#     upload:
#       needs: gate
#       if: needs.gate.outputs.upload == 'true'
#       uses: Frazzled-Productions/.github/.github/workflows/ios-testflight.yml@v1
#       with:
#         engine-package: LoopYearEngine
#         secrets-xcconfig: ${{ vars.SECRETS_XCCONFIG || '/Users/fraser/.config/loop-year/Secrets.xcconfig' }}
#         asc-key-id: ${{ vars.ASC_KEY_ID }}
#         asc-issuer-id: ${{ vars.ASC_ISSUER_ID }}
#
# This workflow checks out github.sha, which for workflow_run is the tip of main; that is why the
# caller's gate requires the tested commit to still be the tip.
# The key ID and issuer ID are identifiers, not secrets; the caller passes its own repo variables.
# Setup steps: ops/standards/new-ios-app-playbook.md, section 6.

on:
  workflow_call:
    inputs:
      engine-package:
        description: Path to the engine Swift package, e.g. LoopYearEngine.
        type: string
        required: true
      secrets-xcconfig:
        description: Absolute path on the build Mac of the keeper Secrets.xcconfig (RevenueCat key).
        type: string
        required: true
      asc-key-id:
        description: App Store Connect API key ID (the caller's ASC_KEY_ID variable).
        type: string
        required: true
      asc-issuer-id:
        description: App Store Connect API issuer ID (the caller's ASC_ISSUER_ID variable).
        type: string
        required: true
      release-script:
        description: The app's archive-and-upload script.
        type: string
        default: tools/release/testflight.sh
      runs-on:
        description: Runner labels as a JSON array.
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'
      timeout-minutes:
        description: Job timeout, including up to 60 minutes waiting for the build lock.
        type: number
        default: 130

jobs:
  upload:
    name: Archive and upload to TestFlight
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Fetch the shared OpenSpec tools at this workflow's commit
        env:
          # job.workflow_repository and job.workflow_sha name this reusable workflow's own repository and
          # commit (GitHub's contexts reference). Read through toJSON(job) because actionlint 1.7.12
          # does not know those two properties yet.
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          TOOLS_REPO=$(python3 -c 'import json, os; print(json.loads(os.environ["JOB_CONTEXT"]).get("workflow_repository") or "")')
          TOOLS_SHA=$(python3 -c 'import json, os; print(json.loads(os.environ["JOB_CONTEXT"]).get("workflow_sha") or "")')
          [[ "$TOOLS_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::job.workflow_repository is '$TOOLS_REPO', not owner/repo."; exit 1; }
          [[ "$TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$TOOLS_SHA', not a SHA."; exit 1; }
          tools="$RUNNER_TEMP/frazzled-openspec-tools"
          rm -rf "$tools" && git init -q "$tools"
          git -C "$tools" fetch -q --depth 1 "$GITHUB_SERVER_URL/$TOOLS_REPO" "$TOOLS_SHA"
          git -C "$tools" checkout -q --detach FETCH_HEAD
          # job.workflow_sha is the commit, or the tag object when the caller references an annotated tag.
          # Either way it names exactly one commit, and that must be what is checked out.
          want=$(git -C "$tools" rev-parse --verify --quiet "$TOOLS_SHA^{commit}") || { echo "::error::$TOOLS_SHA does not name a commit."; exit 1; }
          if [ "$(git -C "$tools" rev-parse "FETCH_HEAD^{commit}")" != "$want" ] || [ "$(git -C "$tools" rev-parse HEAD)" != "$want" ]; then
            echo "::error::Fetched the wrong tools commit."; exit 1
          fi
          echo "Shared tools: $TOOLS_REPO at $want (job.workflow_sha $TOOLS_SHA)"

      - name: Reap before
        timeout-minutes: 3
        run: bash "$RUNNER_TEMP/frazzled-openspec-tools/tools/ios/ci-sim.sh" reap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Provide the Release RevenueCat key
        env:
          SECRETS_XCCONFIG: ${{ inputs.secrets-xcconfig }}
        run: |
          set -euo pipefail
          [ -f "$SECRETS_XCCONFIG" ] || { echo "::error::No Secrets.xcconfig at $SECRETS_XCCONFIG"; exit 1; }
          cp "$SECRETS_XCCONFIG" Config/Secrets.xcconfig
          chmod 600 Config/Secrets.xcconfig
          git check-ignore -q Config/Secrets.xcconfig || { rm -f Config/Secrets.xcconfig; echo "::error::Secrets.xcconfig is not gitignored"; exit 1; }

      # One step, so one wait for the lock: the engine tests must pass before shipping.
      - name: Engine tests, archive and upload (under the host build lock)
        timeout-minutes: 120
        env:
          ENGINE_PACKAGE: ${{ inputs.engine-package }}
          ASC_KEY_ID: ${{ inputs.asc-key-id }}
          ASC_ISSUER_ID: ${{ inputs.asc-issuer-id }}
          RELEASE_SCRIPT: ${{ inputs.release-script }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/frazzled-openspec-tools/tools/ios/with-build-lock.sh" \
            --label "${GITHUB_REPOSITORY#*/} TestFlight" -- \
            bash -c 'swift test --package-path "$ENGINE_PACKAGE" && zsh "$RELEASE_SCRIPT"'

      - name: Remove the key file
        if: always()
        run: rm -f Config/Secrets.xcconfig

      - name: Reap after
        if: always()
        timeout-minutes: 3
        run: bash "$RUNNER_TEMP/frazzled-openspec-tools/tools/ios/ci-sim.sh" reap

      - name: Summary
        if: success()
        run: |
          echo "### TestFlight build uploaded from \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Internal testers see it once Apple finishes processing." >> "$GITHUB_STEP_SUMMARY"
