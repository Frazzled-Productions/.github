name: OpenSpec overlap (reusable)

# Catches, before merge, the two ways the after-merge archive (openspec-archive.yml) can lose or fail a
# change: two open PRs whose deltas MODIFY, REMOVE or RENAME the same requirement (the second archive
# would silently overwrite the first: OpenSpec issues #1246, #1387, #2033), and a MODIFIED, REMOVED or
# RENAMED target that is no longer on the base branch. Each finding is a warning annotation; the check
# fails only for those two. It also runs `openspec validate --strict` on each change the PR adds or
# edits. Logic and a local test mode: tools/openspec/overlap.py, fetched from this repository at the
# commit this workflow runs from, never from the PR. PRs without OpenSpec deltas pass at once.
# Moved here from roast-conductor (owner decision 23 October 2026).
#
# Consumer (thin caller in the app repo's .github/workflows/openspec-overlap.yml):
#
#   name: OpenSpec overlap
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#   permissions:
#     contents: read
#   jobs:
#     overlap:
#       name: OpenSpec overlap
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: Frazzled-Productions/.github/.github/workflows/openspec-overlap.yml@v1
#
# The check is then named "OpenSpec overlap / OpenSpec overlap".

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner labels as a JSON array, or a JSON string. Needs git, gh, python3 and the openspec CLI.
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'
      base-branch:
        description: The branch whose specs the deltas are checked against.
        type: string
        default: main

permissions:
  contents: read

jobs:
  overlap:
    name: OpenSpec overlap
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    concurrency:
      group: openspec-overlap-job-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OPENSPEC_TELEMETRY: '0'
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE: ${{ inputs.base-branch }}
    steps:
      - name: Fetch the shared OpenSpec tools at this workflow's commit
        env:
          # job.workflow_repository and job.workflow_sha name this reusable workflow's own repository and
          # commit (GitHub's contexts reference). Read through toJSON(job) because actionlint 1.7.12
          # does not know those two properties yet.
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          TOOLS_REPO=$(python3 -c 'import json, os; print(json.loads(os.environ["JOB_CONTEXT"]).get("workflow_repository") or "")')
          TOOLS_SHA=$(python3 -c 'import json, os; print(json.loads(os.environ["JOB_CONTEXT"]).get("workflow_sha") or "")')
          [[ "$TOOLS_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::job.workflow_repository is '$TOOLS_REPO', not owner/repo."; exit 1; }
          [[ "$TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$TOOLS_SHA', not a commit SHA."; exit 1; }
          tools="$RUNNER_TEMP/frazzled-openspec-tools"
          rm -rf "$tools" && git init -q "$tools"
          git -C "$tools" fetch -q --depth 1 "$GITHUB_SERVER_URL/$TOOLS_REPO" "$TOOLS_SHA"
          git -C "$tools" checkout -q --detach FETCH_HEAD
          [ "$(git -C "$tools" rev-parse HEAD)" = "$TOOLS_SHA" ] || { echo "::error::Fetched the wrong tools commit."; exit 1; }
          echo "Shared tools: $TOOLS_REPO at $TOOLS_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the base branch
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::'$BASE' is not an allowed branch name."; exit 1; }
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64)" fetch --quiet --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

      - name: Validate this PR's changes
        run: |
          set -euo pipefail
          changes=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path' \
            | sed -nE 's#^openspec/changes/([^/]+)/.*#\1#p' | grep -vx archive | sort -u || true)
          for name in $changes; do
            if [ -d "openspec/changes/$name" ]; then
              openspec validate "$name" --type change --strict --no-interactive
            fi
          done
          [ -n "$changes" ] || echo "No OpenSpec changes in this PR."

      - name: Overlap with other open PRs and with the base branch
        run: python3 "$RUNNER_TEMP/frazzled-openspec-tools/tools/openspec/overlap.py" --pr "$PR_NUMBER" --main-ref "origin/$BASE"
