name: Secret scan (reusable)

# Scans the history reachable from the caller's HEAD for committed secrets with gitleaks and fails on
# a finding. Lifted from koinori's secret-scan.yml (ops A10). It is the free alternative to GitHub secret
# scanning, which is a paid add-on for private repos on the Team plan (ops ADR 0011). Consumer:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     secret-scan:
#       uses: Frazzled-Productions/.github/.github/workflows/secret-scan.yml@v1
#
# Known false positives go in a .gitleaksignore at the caller's repo root (gitleaks reads it
# automatically). gitleaks is pinned to a release and its checksum, not "latest", so a
# compromised release cannot reach every repo at once; Dependabot does not bump it, so move the
# pins by hand (one checksum per platform, from the release's checksums file).
#
# Runs on Linux X64 (hosted) and macOS ARM64 (the light runners on the Mac): tools/ci/gitleaks-install.sh,
# fetched from this repository at this workflow's commit, picks the binary for the runner and installs
# it into the job's temp folder, with no sudo. Only HEAD's history is scanned (--log-opts="HEAD"): a
# self-hosted workspace keeps old fetched refs, such as a stale refs/remotes/pull/<n>/merge, and
# gitleaks scans every ref by default (loop-year #83, koinori 9710ad80c).

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: gitleaks release to run, without the leading v.
        type: string
        default: '8.30.1'
      gitleaks-sha256:
        description: SHA-256 of gitleaks_<version>_linux_x64.tar.gz from that release's checksums file.
        type: string
        default: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      gitleaks-sha256-darwin-arm64:
        description: SHA-256 of gitleaks_<version>_darwin_arm64.tar.gz from that release's checksums file.
        type: string
        default: 'b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5'
      runs-on:
        description: Runner labels as a JSON array or JSON string, or one raw label such as self-hosted. Empty means the organisation's LIGHT_RUNNER, else ubuntu-latest.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs-on == '' && fromJSON(vars.LIGHT_RUNNER || '"ubuntu-latest"') || (startsWith(inputs.runs-on, '[') || startsWith(inputs.runs-on, '"')) && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - name: Fetch the shared OpenSpec tools at this workflow's commit
        env:
          # job.workflow_repository and job.workflow_sha name this reusable workflow's own repository and
          # commit (GitHub's contexts reference). Read through toJSON(job) because actionlint 1.7.12
          # does not know those two properties yet.
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          set -euo pipefail
          TOOLS_REPO=$(python3 -c 'import json, os; print(json.loads(os.environ["JOB_CONTEXT"]).get("workflow_repository") or "")')
          TOOLS_SHA=$(python3 -c 'import json, os; print(json.loads(os.environ["JOB_CONTEXT"]).get("workflow_sha") or "")')
          [[ "$TOOLS_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::job.workflow_repository is '$TOOLS_REPO', not owner/repo."; exit 1; }
          [[ "$TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$TOOLS_SHA', not a SHA."; exit 1; }
          tools="$RUNNER_TEMP/frazzled-openspec-tools"
          rm -rf "$tools" && git init -q "$tools"
          git -C "$tools" fetch -q --depth 1 "$GITHUB_SERVER_URL/$TOOLS_REPO" "$TOOLS_SHA"
          git -C "$tools" checkout -q --detach FETCH_HEAD
          # job.workflow_sha is the commit, or the tag object when the caller references an annotated tag.
          # Either way it names exactly one commit, and that must be what is checked out.
          want=$(git -C "$tools" rev-parse --verify --quiet "$TOOLS_SHA^{commit}") || { echo "::error::$TOOLS_SHA does not name a commit."; exit 1; }
          if [ "$(git -C "$tools" rev-parse "FETCH_HEAD^{commit}")" != "$want" ] || [ "$(git -C "$tools" rev-parse HEAD)" != "$want" ]; then
            echo "::error::Fetched the wrong tools commit."; exit 1
          fi
          echo "Shared tools: $TOOLS_REPO at $want (job.workflow_sha $TOOLS_SHA)"

      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The gitleaks-action wants a licence for orgs; the release binary needs none.
      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
          SHA256_LINUX_X64: ${{ inputs.gitleaks-sha256 }}
          SHA256_DARWIN_ARM64: ${{ inputs.gitleaks-sha256-darwin-arm64 }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/gitleaks-bin" && mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          bash "$RUNNER_TEMP/frazzled-openspec-tools/tools/ci/gitleaks-install.sh" \
            "$VERSION" "$SHA256_LINUX_X64" "$SHA256_DARWIN_ARM64" "$RUNNER_TEMP/gitleaks-bin"

      - name: Run gitleaks over HEAD's history
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --redact --verbose --log-opts="HEAD"
