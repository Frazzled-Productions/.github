name: Secret scan (reusable)

# Scans the caller's full git history for committed secrets with gitleaks and fails on a finding.
# Lifted from koinori's secret-scan.yml (ops A10). It is the free alternative to GitHub secret
# scanning, which is a paid add-on for private repos on the Team plan (ops ADR 0011). Consumer:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     secret-scan:
#       uses: Frazzled-Productions/.github/.github/workflows/secret-scan.yml@v1
#
# Known false positives go in a .gitleaksignore at the caller's repo root (gitleaks reads it
# automatically). gitleaks is pinned to a release and its checksum, not "latest", so a
# compromised release cannot reach every repo at once; Dependabot does not bump it, so move the
# pin by hand.

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: gitleaks release to run, without the leading v.
        type: string
        default: '8.30.1'
      gitleaks-sha256:
        description: SHA-256 of gitleaks_<version>_linux_x64.tar.gz from that release's checksums file.
        type: string
        default: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      runs-on:
        description: Runner label. Linux only (the linux_x64 binary is installed).
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The gitleaks-action wants a licence for orgs; the release binary needs none.
      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
          SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${tarball}" -o "$tarball"
          echo "${SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks over git history
        run: gitleaks git . --redact --verbose
