name: Self-test

# Checks this repo's own workflows on every PR and on main, on GitHub-hosted Ubuntu (never the
# self-hosted Mac runner: this repo is public, so anyone could open a PR that runs on it).
#   - actionlint: syntax, expressions, shellcheck of run scripts;
#   - zizmor: Actions security audit (template injection, unpinned actions, credentials);
#   - test-integrity: runs the reusable check on this repo's own PRs, in warn-only mode;
#   - OpenSpec tools: the unit tests of tools/ (approve_runs.py guards, archive.py checks, requirement_length.py,
#     changed_files.py rules, required.py, context_budget.py, the command-centre liveness rule) with
#     the openspec CLI installed from npm at a pinned version;
#   - OpenSpec changed files, overlap and required: the reusable workflows run against this repo, which
#     proves they fetch their tools from their own commit (job.workflow_sha). Overlap installs the CLI
#     through its install-openspec input. OpenSpec required runs warn-only, because this repo has no
#     openspec/ (its tooling changes are specced in roast-conductor's openspec-tooling, Fraser,
#     23 October 2026), and its result is checked: "adopt OpenSpec first" on a code PR, a pass on a
#     docs-only one. The archive and docs-only check workflows are exercised by their callers;
#   - Context budget: this repo's own check against .github/context-budget.txt;
#   - Shared script tests (ops #345): the tools/ios guards for the iOS workflows (reap selection,
#     preboot naming, retry classification, build-lock fallback, Lockfile gate and check) and the
#     tools/ci gitleaks installer, with shellcheck; all against stubs, never a real simulator or Xcode;
#   - Light routing: em-dash-check with no runs-on, a raw label and a JSON string all start on hosted
#     Ubuntu (this repo is public, so the organisation's LIGHT_RUNNER is not visible to it).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --format=github .github/workflows/

  test-integrity:
    name: Test integrity
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/test-integrity.yml # zizmor: ignore[self-repository]
    with:
      warn-only: true

  openspec-tools:
    name: OpenSpec tools tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the openspec CLI
        # Exact version, no install scripts; a test-only tool on a throwaway runner.
        run: npm install --global --ignore-scripts @fission-ai/openspec@1.14.3 # zizmor: ignore[adhoc-packages]
      - name: Unit tests
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
          python3 -m unittest discover -s tools/openspec -p 'test_*.py' -v
          python3 -m unittest discover -s tools/liveness -p 'test_*.py' -v
          python3 -m unittest discover -s tools/ios -p 'test_*.py' -v

  shared-scripts:
    name: Shared iOS and CI script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck tools/ios/*.sh tools/ios/tests/*.sh tools/ci/*.sh
      - name: tools/ios tests
        run: |
          set -euo pipefail
          for t in tools/ios/tests/*.test.sh; do bash "$t"; done
      - name: Install the pinned gitleaks through the shared installer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          bash tools/ci/gitleaks-install.sh 8.30.1 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: gitleaks installer and HEAD-only scan
        run: bash tools/ci/test-gitleaks-install.sh

  route-default:
    name: Light route, no runs-on
    uses: ./.github/workflows/em-dash-check.yml # zizmor: ignore[self-repository]

  route-raw-label:
    name: Light route, raw label
    uses: ./.github/workflows/em-dash-check.yml # zizmor: ignore[self-repository]
    with:
      runs-on: ubuntu-latest

  route-json-string:
    name: Light route, JSON string
    uses: ./.github/workflows/em-dash-check.yml # zizmor: ignore[self-repository]
    with:
      runs-on: '"ubuntu-latest"'

  openspec-changed-files:
    name: OpenSpec changed files
    uses: ./.github/workflows/openspec-changed-files.yml # zizmor: ignore[self-repository]
    with:
      runs-on: '"ubuntu-latest"'

  openspec-changed-files-result:
    name: OpenSpec changed files result
    needs: openspec-changed-files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Output is true or false
        env:
          DOCS_ONLY: ${{ needs.openspec-changed-files.outputs.docs-only }}
        run: |
          echo "docs-only=$DOCS_ONLY"
          [ "$DOCS_ONLY" = true ] || [ "$DOCS_ONLY" = false ]

  openspec-overlap:
    name: OpenSpec overlap
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/openspec-overlap.yml # zizmor: ignore[self-repository]
    with:
      runs-on: '"ubuntu-latest"'
      install-openspec: true

  openspec-required:
    name: OpenSpec required
    permissions:
      contents: read
      pull-requests: write
      issues: read
    uses: ./.github/workflows/openspec-required.yml # zizmor: ignore[self-repository]
    with:
      runs-on: '"ubuntu-latest"'
      warn-only: true

  openspec-required-result:
    name: OpenSpec required result
    needs: openspec-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Adopt-first on a code PR, a pass otherwise
        env:
          RESULT: ${{ needs.openspec-required.outputs.result }}
          REASON: ${{ needs.openspec-required.outputs.reason }}
        run: |
          echo "result=$RESULT reason=$REASON"
          case "$RESULT/$REASON" in
            fail/adopt-first|pass/docs-only|pass/not-a-pr|pass/dependabot) ;;
            *) echo "::error::Unexpected OpenSpec required result here: $RESULT/$REASON."; exit 1 ;;
          esac

  context-budget:
    name: Context budget
    uses: ./.github/workflows/context-budget.yml # zizmor: ignore[self-repository]
    with:
      runs-on: '"ubuntu-latest"'
